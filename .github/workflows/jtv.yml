name: Convert M3U to JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch M3U file
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: |
          curl -L \
            --retry 3 \
            --silent \
            --show-error \
            "$M3U_URL" \
            -o input.m3u

      - name: Convert M3U to JSON
        run: |
          python3 <<'PY'
          import json
          import re

          with open("input.m3u", "r", encoding="utf-8") as f:
              lines = [line.strip() for line in f if line.strip()]

          channels = []
          current = {}

          for line in lines:
              if line.startswith("#EXTINF:"):
                  if current:
                      channels.append(current)

                  attrs = dict(re.findall(
                      r'([A-Za-z0-9_-]+)="([^"]*)"',
                      line
                  ))

                  name = line.split(",", 1)[1].strip() if "," in line else ""

                  current = {
                      "name": name,
                      "id": attrs.get("tvg-id", ""),
                      "category": "",
                      "logo": attrs.get("tvg-logo", ""),
                      "mpd": "",
                      "cookie": "",
                      "keyId": "",
                      "key": ""
                  }

              elif line.startswith("#KODIPROP:inputstream.adaptive.license_key="):
                  if current:
                      value = line.split("=", 1)[1].strip()

                      if ":" in value:
                          key_id, key = value.split(":", 1)
                          current["keyId"] = key_id.strip()
                          current["key"] = key.strip()

              elif line.startswith("#EXTHTTP:"):
                  if current:
                      try:
                          http_data = json.loads(line.split(":", 1)[1].strip())
                          current["cookie"] = http_data.get("cookie", "")
                      except Exception:
                          pass

              elif line.startswith("http://") or line.startswith("https://"):
                  if current:
                      current["mpd"] = line

          if current:
              channels.append(current)

          with open("channels.json", "w", encoding="utf-8") as f:
              json.dump(channels, f, indent=2, ensure_ascii=False)

          print(f"Converted {len(channels)} channels")
          PY

      - name: Commit JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels.json

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Update channels JSON"
            git push
          fi
