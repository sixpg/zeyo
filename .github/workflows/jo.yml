name: JSON → M3U (from API)

on:
  workflow_dispatch:          # Manual run
  schedule:
    - cron: '0 */4 * * *'     # Every 4 hours (optional)
  push:
    paths:
      - '.github/workflows/json-to-m3u.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch API & Convert to M3U
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import sys

          API_URL = "https://jiotvapi.droozy.workers.dev/"

          print(f"Fetching channels from {API_URL} ...")
          try:
              with urllib.request.urlopen(API_URL, timeout=30) as resp:
                  raw = resp.read().decode("utf-8")
          except Exception as e:
              print(f"::error::Failed to fetch API: {e}")
              sys.exit(1)

          try:
              channels = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::Invalid JSON from API: {e}")
              sys.exit(1)

          if not isinstance(channels, list):
              print("::error::API did not return an array")
              sys.exit(1)

          print(f"Received {len(channels)} channels")

          lines = ["#EXTM3U"]

          for ch in channels:
              name     = str(ch.get("name", "Unknown")).strip()
              url      = str(ch.get("url", "")).strip()
              logo     = str(ch.get("logo", "")).strip()
              category = str(ch.get("category", "Entertainment")).strip()
              ch_id    = str(ch.get("id", "")).strip()
              cookie   = str(ch.get("cookie", "")).strip()

              # Handle both key formats
              keys = str(ch.get("all_keys", "")).strip()
              if not keys:
                  # single key format: keyId:key
                  key_id = str(ch.get("keyId", "")).strip()
                  key    = str(ch.get("key", "")).strip()
                  if key_id and key:
                      keys = f"{key_id}:{key}"

              if not url or not name:
                  continue

              # Append cookie to stream URL
              stream = url
              if cookie:
                  sep = "&" if "?" in url else "?"
                  stream = f"{url}{sep}{cookie}"

              lines.append(
                  f'#EXTINF:-1 tvg-id="{ch_id}" '
                  f'tvg-name="{name}" '
                  f'tvg-logo="{logo}" '
                  f'group-title="{category}",{name}'
              )
              lines.append("#KODIPROP:inputstream=inputstream.adaptive")
              lines.append("#KODIPROP:inputstream.adaptive.manifest_type=mpd")
              lines.append("#KODIPROP:inputstream.adaptive.license_type=clearkey")
              if keys:
                  lines.append(f"#KODIPROP:inputstream.adaptive.license_key={keys}")
              lines.append(stream)
              lines.append("")

          with open("jtv.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(lines).rstrip() + "\n")

          print(f"Successfully generated playlist with {len(channels)} channels")
          EOF

      - name: Upload M3U as private artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-${{ github.run_number }}
          path: jtv.m3u
          retention-days: 7
