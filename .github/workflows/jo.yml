
name: JSON to M3U Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert JSON to M3U
        env:
          JSON_URL: ${{ secrets.JSON_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from urllib.parse import urlparse

          request = urllib.request.Request(
              os.environ["JSON_URL"],
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=60) as r:
              data = json.loads(r.read().decode("utf-8"))

          if isinstance(data, dict):
              data = data.get("channels", data.get("data", []))

          if not isinstance(data, list):
              raise ValueError("Invalid JSON format")

          output = ["#EXTM3U"]
          count = 0

          for ch in data:
              if not isinstance(ch, dict):
                  continue

              name = str(ch.get("name") or "").replace('"', "&quot;")
              cid = str(ch.get("id") or "").replace('"', "&quot;")
              logo = str(ch.get("logo") or "").replace('"', "&quot;")
              category = str(ch.get("category") or "").replace('"', "&quot;")
              url = str(ch.get("url") or "").strip()

              if not name or not url:
                  continue

              if urlparse(url).scheme not in ("http", "https"):
                  continue

              output.append(
                  f'#EXTINF:-1 tvg-id="{cid}" '
                  f'tvg-name="{name}" tvg-logo="{logo}" '
                  f'group-title="{category}",{name}'
              )

              path = urlparse(url).path.lower()

              if path.endswith(".mpd"):
                  output.extend([
                      "#KODIPROP:inputstream=inputstream.adaptive",
                      "#KODIPROP:inputstream.adaptive.manifest_type=mpd"
                  ])

              elif path.endswith(".m3u8"):
                  output.extend([
                      "#KODIPROP:inputstream=inputstream.adaptive",
                      "#KODIPROP:inputstream.adaptive.manifest_type=hls"
                  ])

              output.append(url)
              count += 1

          if count == 0:
              raise ValueError("No valid channels found")

          with open("output.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print(f"Generated {count} channels")
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output.m3u

          if ! git diff --cached --quiet; then
            git commit -m "Update M3U playlist"
            git push
          else
            echo "No changes detected"
          fi
