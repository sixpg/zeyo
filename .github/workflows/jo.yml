name: Generate M3U Playlist

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab
  schedule:
    - cron: '0 */6 * * *' # Optional: Runs automatically every 6 hours. Adjust as needed.

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push the file back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch JSON and Generate M3U
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import os

          api_url = os.environ.get('API_URL')
          if not api_url:
              raise ValueError("API_URL environment variable is not set in Secrets")

          # Fetch JSON data from the secret API URL
          req = urllib.request.Request(api_url, headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
          except Exception as e:
              print(f"Failed to fetch JSON from API: {e}")
              raise e

          m3u_content = ["#EXTM3U"]

          for channel in data:
              channel_id = str(channel.get("id", ""))
              name = channel.get("name", "")
              logo = channel.get("logo", "")
              category = channel.get("category", "General")
              url = channel.get("url", "")
              cookie = channel.get("cookie", "")
              all_keys = channel.get("all_keys", "")

              # 1. Build EXTINF line
              extinf = f'#EXTINF:-1 tvg-id="{channel_id}" tvg-name="{name}" tvg-logo="{logo}" group-title="{category}",{name}'
              m3u_content.append(extinf)
              
              # 2. Build KODIPROP lines
              m3u_content.append("#KODIPROP:inputstream=inputstream.adaptive")
              m3u_content.append("#KODIPROP:inputstream.adaptive.manifest_type=mpd")
              m3u_content.append("#KODIPROP:inputstream.adaptive.license_type=clearkey")
              m3u_content.append(f"#KODIPROP:inputstream.adaptive.license_key={all_keys}")
              
              # 3. Build final URL with cookie appended
              if cookie:
                  separator = "&" if "?" in url else "?"
                  final_url = f"{url}{separator}{cookie}"
              else:
                  final_url = url
                  
              m3u_content.append(final_url)
              m3u_content.append("") # Empty line for readability between channels

          # Write to file
          with open("jtv.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(m3u_content).strip() + "\n")
          
          print("✅ Successfully generated jtv.m3u")
          EOF

      - name: Commit and push generated M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jtv.m3u
          
          # Commit only if there are changes, [skip ci] prevents infinite trigger loops
          git commit -m "chore: auto-update jtv.m3u [skip ci]" || echo "No changes to commit"
          git push
