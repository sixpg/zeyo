# .github/workflows/update-m3u.yml
name: Auto Update M3U
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Requests
        run: pip install requests

      - name: Generate M3U
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          python << 'EOF'
          import os
          import json
          import requests

          url = os.environ["API_URL"]
          response = requests.get(url, timeout=60)
          data = response.json()

          # IDs of channels to filter out
          EXCLUDED_IDS = {
              "0-9-zeecafehd",
              "0-9-channel_2105335046",
              "1003",
              "1011",
              "1018",
              "1460"
          }

          lines = ['#EXTM3U']

          for ch in data:
              gid = str(ch.get("id", ""))
              
              # Skip specified channels
              if gid in EXCLUDED_IDS:
                  continue

              name = ch.get("name", "Unknown")
              logo = ch.get("logo", "")
              group = ch.get("category", "Live TV")
              stream = ch.get("url", "")
              kid = ch.get("keyId", "")
              key = ch.get("key", "")
              cookie = ch.get("cookie", "")

              # Channel info line
              lines.append(f'#EXTINF:-1 tvg-id="{gid}" group-title="{group}" tvg-logo="{logo}",{name}')

              # Clearkey DRM properties
              if kid and key and kid not in ["null", None, ""] and key not in ["null", None, ""]:
                  lines.append("#KODIPROP:inputstream.adaptive.license_type=clearkey")
                  lines.append(f"#KODIPROP:inputstream.adaptive.license_key={kid}:{key}")

              # User-agent header
              lines.append("#EXTVLCOPT:http-user-agent=Droovy")

              # Cookie headers and stream URL formatting
              if cookie:
                  http_prop = json.dumps({"cookie": cookie})
                  lines.append(f"#EXTHTTP:{http_prop}")
                  
                  if "?" in stream:
                      final_url = f"{stream}&{cookie}"
                  else:
                      final_url = f"{stream}?{cookie}"
              else:
                  final_url = stream

              lines.append(final_url)
              lines.append("")

          with open("jtv.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          EOF

      - name: Commit Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jtv.m3u
          git commit -m "Auto update playlist" || echo "No changes"
          git push
