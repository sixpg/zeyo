name: Generate M3U Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch JSON and Generate M3U
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import os

          api_url = os.environ.get('API_URL')
          if not api_url:
              raise ValueError("API_URL environment variable is not set in Secrets")

          req = urllib.request.Request(api_url, headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
          except Exception as e:
              print(f"Failed to fetch JSON from API: {e}")
              raise e

          m3u_content = ["#EXTM3U", ""]

          for channel in data:
              channel_id = str(channel.get("id", ""))
              name = channel.get("name", "")
              logo = channel.get("logo", "")
              category = channel.get("category", "General")
              url = channel.get("url", "")
              cookie = channel.get("cookie", "")
              all_keys = channel.get("all_keys", "")

              # EXTINF line (with logo if available)
              if logo:
                  extinf = f'#EXTINF:-1 tvg-id="{channel_id}" tvg-name="{name}" tvg-logo="{logo}" group-title="{category}",{name}'
              else:
                  extinf = f'#EXTINF:-1 tvg-id="{channel_id}" tvg-name="{name}" group-title="{category}",{name}'
              m3u_content.append(extinf)

              # KODIPROP lines (exact format you requested)
              m3u_content.append("#KODIPROP:inputstream.adaptive.manifest_type=mpd")
              m3u_content.append("#KODIPROP:inputstream.adaptive.license_type=org.w3.clearkey")

              # Convert all_keys → JSON object {"kid1":"key1","kid2":"key2",...}
              if all_keys:
                  key_pairs = {}
                  for pair in all_keys.split(","):
                      pair = pair.strip()
                      if ":" in pair:
                          kid, key = pair.split(":", 1)
                          kid = kid.strip()
                          key = key.strip()
                          if kid and key:
                              key_pairs[kid] = key

                  if key_pairs:
                      license_key_json = json.dumps(key_pairs, separators=(',', ':'))
                      m3u_content.append(f"#KODIPROP:inputstream.adaptive.license_key={license_key_json}")

              # EXTVLCOPT headers (exactly as you specified)
              m3u_content.append("#EXTVLCOPT:http-user-agent=Droovy")
              m3u_content.append("#EXTVLCOPT:http-referrer=https://www.jiotv.com/")
              m3u_content.append("#EXTVLCOPT:http-origin=https://www.jiotv.com")

              # Final URL + cookie
              if cookie:
                  separator = "&" if "?" in url else "?"
                  final_url = f"{url}{separator}{cookie}"
              else:
                  final_url = url

              m3u_content.append(final_url)
              m3u_content.append("")  # blank line between channels

          with open("jtv.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(m3u_content).strip() + "\n")

          print("✅ Successfully generated jtv.m3u")
          EOF

      - name: Commit and push generated M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jtv.m3u
          git commit -m "chore: auto-update jtv.m3u [skip ci]" || echo "No changes to commit"
          git push
