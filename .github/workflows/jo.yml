name: JSON → M3U (Kodi ClearKey)

on:
  workflow_dispatch:          # Manual trigger
  schedule:
    - cron: '0 */6 * * *'     # Optional: every 6 hours
  push:
    paths:
      - '.github/workflows/json-to-m3u.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert JSON → M3U
        env:
          CHANNELS_JSON: ${{ secrets.CHANNELS_JSON }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys

          raw = os.environ.get("CHANNELS_JSON", "").strip()
          if not raw:
              print("::error::Secret CHANNELS_JSON is empty or missing")
              sys.exit(1)

          try:
              channels = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::Invalid JSON: {e}")
              sys.exit(1)

          if not isinstance(channels, list):
              print("::error::JSON must be an array")
              sys.exit(1)

          lines = ["#EXTM3U"]

          for ch in channels:
              name     = str(ch.get("name", "Unknown")).strip()
              url      = str(ch.get("url", "")).strip()
              logo     = str(ch.get("logo", "")).strip()
              category = str(ch.get("category", "Entertainment")).strip()
              ch_id    = str(ch.get("id", "")).strip()
              cookie   = str(ch.get("cookie", "")).strip()
              keys     = str(ch.get("all_keys", "")).strip()

              if not url or not name:
                  continue

              # Append cookie to URL
              stream = url
              if cookie:
                  sep = "&" if "?" in url else "?"
                  stream = f"{url}{sep}{cookie}"

              lines.append(
                  f'#EXTINF:-1 tvg-id="{ch_id}" '
                  f'tvg-name="{name}" '
                  f'tvg-logo="{logo}" '
                  f'group-title="{category}",{name}'
              )
              lines.append("#KODIPROP:inputstream=inputstream.adaptive")
              lines.append("#KODIPROP:inputstream.adaptive.manifest_type=mpd")
              lines.append("#KODIPROP:inputstream.adaptive.license_type=clearkey")
              if keys:
                  lines.append(f"#KODIPROP:inputstream.adaptive.license_key={keys}")
              lines.append(stream)
              lines.append("")

          with open("jtv.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(lines).rstrip() + "\n")

          print(f"Generated {len(channels)} channels")
          EOF

      - name: Upload M3U as private artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-${{ github.run_number }}
          path: jtv.m3u
          retention-days: 7
